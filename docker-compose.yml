services:
  trading-bot:
    build: .
    container_name: trading-bot-automated-trading-bot-1
    restart: unless-stopped
    # --- NOUVELLE SECTION AJOUTÉE ICI ---
    volumes:
      # Syntaxe: [dossier sur la machine hôte]:[dossier dans le conteneur]
      - ./logs:/app/logs
    # The app logs to stdout only; without this, Docker's default json-file
    # driver keeps growing forever on a long-running container.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  default:
    name: trading-bot-automated_default
